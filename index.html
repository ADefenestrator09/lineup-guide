<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lineup Guide</title>
<style>
:root{--bg:#0b1118;--pn:#141d28;--pn2:#1b2735;--ed:#263547;--red:#ff4655;--tx:#ece8e1;--mu:#8795a5;--teal:#4fd1c5;--cut:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 400px at 85% -100px,#ff465522,transparent),var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.disp,h1,h2,.logo{font-family:Impact,"Bahnschrift Condensed","Arial Narrow",sans-serif;letter-spacing:.5px;font-weight:400}
header{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:12px 24px;background:#0b1118e6;backdrop-filter:blur(8px);border-bottom:1px solid var(--ed)}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;text-transform:uppercase;margin-right:12px}
.btn{background:var(--red);color:#fff;border:0;padding:9px 18px;font:600 15px inherit;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));font-family:inherit}
.btn:hover{background:#ff6370}
.btn.g{background:var(--pn2);color:var(--tx)}.btn.g:hover{background:var(--ed)}
main{max-width:1120px;margin:auto;padding:28px 24px 60px}
.hero{position:relative;overflow:hidden;padding:42px 36px;margin-bottom:32px;background:linear-gradient(120deg,var(--pn2),var(--pn));border-left:6px solid var(--red);clip-path:var(--cut)}
.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:280px;height:280px;border:2px solid #ff465540;transform:rotate(45deg)}
.hero h1{font-size:clamp(44px,9vw,84px);line-height:1;text-transform:uppercase}
.hero p{color:var(--mu);margin:10px 0 20px;max-width:46ch}
h1{font-size:38px;text-transform:uppercase;margin-bottom:18px}
.crumbs{color:var(--mu);margin-bottom:10px}.crumbs a{color:var(--red)}.crumbs a:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{position:relative;overflow:hidden;height:130px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,hsl(var(--h) 38% 22%),var(--pn) 75%);clip-path:var(--cut);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:inset 4px 0 var(--red)}
.tile b{font:400 26px Impact,"Arial Narrow",sans-serif;text-transform:uppercase;position:relative}
.tile small{color:#ece8e1b0;position:relative}
.tile i{position:absolute;right:6px;top:-18px;font:400 120px/1 Impact,sans-serif;font-style:normal;color:#fff;opacity:.07}
.tile.off{opacity:.38}
.filters{display:flex;flex-wrap:wrap;gap:10px 24px;margin-bottom:22px}
.fg{display:flex;gap:4px;align-items:center;color:var(--mu)}.fg span{margin-right:6px}
.chip{background:var(--pn2);color:var(--tx);border:0;padding:6px 15px;cursor:pointer;font:600 14px inherit;font-family:inherit}
.chip:hover{background:var(--ed)}.chip.on{background:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--pn);cursor:pointer;clip-path:var(--cut);transition:transform .15s}
.card:hover{transform:translateY(-3px);background:var(--pn2)}
.card img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ph{background:repeating-linear-gradient(45deg,#0d141c,#0d141c 10px,#101822 10px,#101822 20px);color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:14px;text-align:center;padding:8px}
.cb{padding:12px 16px 16px;border-top:3px solid var(--red)}
.cb h3{font-size:17px;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;margin:0 4px 0 0;background:var(--ed);color:var(--tx)}
.tag.o{background:#ff465530;color:#ff8a94}.tag.d{background:#4fd1c530;color:var(--teal)}
.empty{color:var(--mu);padding:40px 0;text-align:center}.empty .btn{margin-top:14px}
nav{display:flex;gap:2px;margin-right:auto}
nav>a,.t{display:flex;align-items:center;gap:6px;padding:8px 14px;color:var(--tx);cursor:pointer}
nav>a:hover,.dd:hover>.t,.t:focus{color:var(--red);outline:0}
.dd,.mi{position:relative}
.menu{display:none;position:absolute;left:0;top:100%;min-width:190px;background:var(--pn);border-top:3px solid var(--red);box-shadow:0 12px 30px #000a;padding:6px 0;z-index:7}
.menu a{display:flex;justify-content:space-between;gap:18px;padding:8px 16px;white-space:nowrap}
.menu a:hover{background:var(--pn2);color:var(--red)}
.dd:hover>.menu,.dd:focus-within>.menu,.mi:hover>.menu,.mi:focus-within>.menu{display:block}
.menu .menu{left:100%;top:-9px}
.srch{position:relative}
.sbox{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--pn2);border-left:3px solid var(--red);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));color:var(--mu);transition:background .15s}
.sbox:focus-within{background:var(--ed);color:var(--tx)}
.sbox input{width:210px;background:none;border:0;color:var(--tx);padding:9px 8px 9px 0;font:inherit}
.sbox input:focus{outline:0}.sbox input::placeholder{color:var(--mu)}
#qr{left:auto;right:0;min-width:280px;max-height:70vh;overflow:auto}#qr.open{display:block}
.tg{font-size:12px;font-weight:700;padding:1px 9px;background:var(--ed);color:var(--tx)}
.tg.off{background:none;outline:1px dashed var(--mu);color:var(--mu)}
.nm{color:var(--mu);padding:8px 16px}
.gear{background:var(--pn2);color:var(--tx);border:0;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}.gear:hover{background:var(--red)}
.cks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px}
.ck{display:flex!important;align-items:center;gap:8px;margin:3px 0!important;color:var(--tx)!important;font-size:15px!important;cursor:pointer}.ck input{accent-color:var(--red);width:16px;height:16px}
.sg{font:400 22px Impact,"Arial Narrow",sans-serif;text-transform:uppercase;margin:26px 0 8px}
.sh{font-size:28px;text-transform:uppercase;margin:34px 0 14px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-bottom:20px}.nav .on{color:var(--mu)}
.sw{display:inline-flex;align-items:center;gap:10px}.sw b{font:400 32px/1 Impact,"Arial Narrow",sans-serif;text-transform:uppercase}
.sw a{width:34px;height:34px;display:grid;place-items:center;background:var(--pn2);font-size:24px;line-height:1;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}.sw a:hover{background:var(--red)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;margin-bottom:24px}
.ban{display:flex;gap:18px;background:var(--pn);border-left:5px solid var(--red);padding:16px;clip-path:var(--cut)}
.ban img{width:38%;min-width:120px;max-height:240px;object-fit:cover;cursor:zoom-in;align-self:flex-start}
.ban>div{flex:1;min-width:0}.ban small{color:var(--mu)}.ban h2{font-size:30px;line-height:1.1;text-transform:uppercase}
.ban p{color:#cfcac2;margin:6px 0 12px;white-space:pre-wrap}.mu{color:var(--mu)}
.tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.tile.hi:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#0b1118e0,transparent 75%)}
.tile b,.tile small{position:relative;z-index:1}
#m{position:fixed;inset:0;background:#000b;overflow:auto;display:none;padding:24px 16px;z-index:8}#m.show{display:block}
.box{position:relative;max-width:820px;margin:auto;padding:28px;background:var(--bg);border-top:4px solid var(--red);box-shadow:0 20px 60px #000a}
.box h2{font-size:34px;text-transform:uppercase;padding-right:40px;line-height:1.1;margin-bottom:8px}
.x{position:absolute;right:14px;top:8px;background:none;border:0;color:var(--tx);font-size:32px;cursor:pointer}
.steps{counter-reset:s}
.step{counter-increment:s;margin-top:26px;padding-left:46px;position:relative}
.step:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;background:var(--red);font:400 20px/32px Impact,sans-serif;text-align:center;transform:rotate(45deg) scale(.85)}
.step:before{transform:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);line-height:32px}
.step h4{font-size:17px;margin-bottom:4px}.step p{color:#cfcac2;margin-bottom:8px;white-space:pre-wrap}
.step img{width:100%;display:block;cursor:zoom-in}
.act{display:flex;gap:10px;margin-top:28px}
label{display:block;color:var(--mu);font-size:13px;margin:14px 0 4px}
input[type=text],select,textarea{width:100%;background:var(--pn);color:var(--tx);border:1px solid var(--ed);padding:9px 10px;font:inherit}
textarea{resize:vertical;min-height:54px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 12px}
.drop{margin-top:6px;border:2px dashed var(--ed);color:var(--mu);text-align:center;cursor:pointer;min-height:70px;display:flex;align-items:center;justify-content:center;padding:6px}
.drop:hover,.drop:focus{border-color:var(--red);outline:0}.drop img{max-width:100%;max-height:200px}
.st{border-left:3px solid var(--ed);padding-left:14px;margin-top:20px}.st h4{margin-top:4px}
.rm{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;font-size:13px;margin-top:4px}
#z{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}#z.show{display:flex}#z img{max-width:96vw;max-height:96vh}
.card{position:relative}
.card.dg{opacity:.35}.card.ov{outline:2px dashed var(--red);outline-offset:-2px}
.fv{background:#0b1118cc;border:0;color:#6b7a8a;font:700 15px inherit;font-family:inherit;padding:3px 9px;cursor:pointer;letter-spacing:1px;vertical-align:middle}
.fv:hover{color:#ffd23f}.fv.f1{color:#c9a46a}.fv.f2{color:#ffb347}.fv.f3{color:#ffd23f;text-shadow:0 0 8px #ffc85788}
.card .fv{position:absolute;top:8px;right:22px;z-index:2}
.card .fv.f0{opacity:0}.card:hover .fv.f0,.card:focus-within .fv.f0{opacity:.85}
@media(hover:none){.card .fv.f0{opacity:.6}}
.tag.ab{background:#8b7bff30;color:#b9b0ff}
.wh{font-size:13px;margin-bottom:4px}
.chip.ok{background:#4fd1c530;color:var(--teal)}.chip.warn{background:#ffb34730;color:#ffb347}
#fs{margin-right:4px}
.nt{margin-top:14px;padding:10px 14px;background:var(--pn);border-left:3px solid var(--teal);color:#cfcac2;white-space:pre-wrap}
.rm{margin-right:14px}
#an{position:fixed;inset:0;background:#05080c;display:none;flex-direction:column;z-index:10}#an.show{display:flex}
.tb{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:2px solid var(--red)}
.tb .g{display:flex;gap:4px;align-items:center}
.sq{width:26px;height:26px;border:2px solid var(--ed);cursor:pointer;padding:0}.sq.on{border-color:#fff;outline:2px solid var(--red)}
.cw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
#an canvas{max-width:100%;max-height:calc(100vh - 110px);cursor:crosshair;touch-action:none;background:#000}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media(max-width:560px){.srch{flex:1 1 150px;min-width:0}.sbox input{width:100%;min-width:0}nav{flex-wrap:wrap}.menu .menu{position:static;box-shadow:none;border:0;padding-left:12px}header{padding:10px 14px;flex-wrap:wrap}.hero{padding:28px 20px}.box{padding:20px}}
footer{max-width:1120px;margin:0 auto;padding:10px 24px 40px;color:var(--mu);font-size:13px}
</style></head><body>

<a class="logo" href="#/"><svg width="28" height="28" viewBox="0 0 24 24"><path fill="#ff4655" d="M12 1l11 11-11 11L1 12z"/><path stroke="#0b1118" stroke-width="2.2" d="M12 6v12M6 12h12"/></svg>Lineup Guide</a>
<nav id="nav"></nav>
<div class="srch"><div class="sbox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg><input id="q" type="text" placeholder="Search agents, maps, lineups" autocomplete="off" aria-label="Search"></div><div class="menu" id="qr"></div></div>
<button class="btn" onclick="edit()">+ Add lineup</button>

const ALLM=["Abyss","Ascent","Bind","Breeze","Corrode","Fracture","Haven","Icebox","Lotus","Pearl","Split","Summit","Sunset"];
const HAS=typeof CONFIG!="undefined",SRC=HAS?CONFIG:{agents:{Brimstone:1,Sova:1},maps:{Abyss:1,Bind:1,Corrode:1,Haven:1,Lotus:1,Summit:1,Sunset:1}};
const mk=(all,o)=>Object.fromEntries([...new Set([...all,...Object.keys(o||{})])].map(k=>[k,!!(o||{})[k]]));
const BASE={agents:mk(ALLA,SRC.agents),maps:mk(ALLM,SRC.maps)};
const on=o=>Object.keys(o).filter(k=>o[k]);let S={},C,AG,MAPS;
function applyCfg(){C={agents:{...BASE.agents,...S.agents},maps:{...BASE.maps,...S.maps}};AG=on(C.agents);MAPS=on(C.maps)}
applyCfg();
const STEPS=[["area","Go to this area","Where to stand / which area to go to"],["aim","Aim here","Where to aim"],["result","To get this","What it lands on"]];
const $=s=>document.querySelector(s),app=$("#app"),enc=encodeURIComponent;
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*13,0)%360;
/* maps that have a C site - add a map name here if it has 3 sites */
const C_MAPS=["Haven","Lotus"];
const SITES=(m,cur)=>{const l=C_MAPS.includes(m)?["A","B","C"]:["A","B"];return cur&&!l.includes(cur)?[...l,cur]:l};
const STAR=["☆","★"];let CUR=[],VI=-1;
const F0=()=>({mode:"",site:"",side:"",ability:"",fav:""});
const ABS=["Recon Dart","Incendiary","Shock Dart"];
const abSel=v=>`<select id="e-ability"><option value="">None</option>${[...new Set([...ABS,...(v?[v]:[])])].map(o=>`<option${o==v?" selected":""}>${E(o)}</option>`).join("")}</select>`;
let I={},L=[],F=F0(),ed=null,pk="";

/* storage: IndexedDB inside your browser, so no folders needed */
const db=new Promise((ok,no)=>{const r=indexedDB.open("lineup-guide",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>ok(r.result);r.onerror=no});
const load=(k,e)=>db.then(d=>new Promise(ok=>{const q=d.transaction("k").objectStore("k").get(k);q.onsuccess=()=>ok(q.result||e);q.onerror=()=>ok(e)})).catch(()=>e);
const put1=(k,v)=>db.then(d=>new Promise((ok,no)=>{const t=d.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=ok;t.onerror=no}));
const save=(k="L")=>put1(k,k=="L"?L:k=="I"?I:S).then(()=>{if(k!="S")autosave()});

const thumb=x=>(x.result?.i||x.aim?.i||x.area?.i||"");
const pic=(s,c="")=>s?`<img src="${s}" alt="" onclick="zoom(this.src)">`:`<div class="ph">No image</div>`;
const cnt=k=>k+(k==1?" lineup":" lineups");
const tags=x=>`<span class="tag ${x.mode=="Offense"?"o":"d"}">${x.mode}</span><span class="tag">${x.site} site</span><span class="tag">${x.side}</span>${x.ability?`<span class="tag ab">${E(x.ability)}</span>`:""}`;
const fvb=x=>`<button class="fv f${x.fav|0}" onclick="event.stopPropagation();cycFav(${x.i})" title="Favourite" aria-label="Favourite">${STAR[x.fav|0]}</button>`;
const card=(x,w)=>`<article class="card" draggable="true" ondragstart="dgs(event,${x.i})" ondragover="dgo(event,${x.i})" ondragleave="dgl(event)" ondrop="dgd(event,${x.i})" ondragend="dge()" tabindex="0" onclick="view(${x.i})" onkeydown="if(event.key=='Enter')view(${x.i})">${fvb(x)}${pic(thumb(x)).replace(' onclick="zoom(this.src)"',' draggable="false"')}<div class="cb"><h3>${E(x.title)}</h3>${w?`<div class="mu wh">${E(x.agent)} · ${E(x.map)}</div>`:""}${tags(x)}</div></article>`;
const tile=(h,n,sub,off,im)=>`<a class="tile${off?" off":""}${im?" hi":""}" href="${h}" style="--h:${hue(n)}">${im?`<img src="${im}" alt="">`:`<i>${E(n[0])}</i>`}<b>${E(n)}</b><small>${sub}</small></a>`;
const num=(a,m)=>L.filter(x=>(!a||x.agent==a)&&(!m||x.map==m)).length;
const AGS=()=>[...AG].sort((a,b)=>a.localeCompare(b));
const sw=(cur,list,href)=>{if(!list.includes(cur))list=[...list,cur];const i=list.indexOf(cur),n=list.length;return `<span class="sw"><a href="${href(list[(i+n-1)%n])}" aria-label="Previous">‹</a><b>${E(cur)}</b><a href="${href(list[(i+1)%n])}" aria-label="Next">›</a></span>`};
const ban=(key,title,label)=>{const v=gi(key)||{};return `<section class="ban">${v.i?`<img src="${v.i}" alt="" onclick="zoom(this.src)">`:""}<div>${label?`<small>${label}</small>`:""}${title?`<h2>${title}</h2>`:""}<p>${v.d?E(v.d):'<span class="mu">No description yet.</span>'}</p><button class="btn g" onclick="editInfo('${key}')">Edit info</button></div></section>`};
const H=(x,y)=>`#/${enc(x)}|${enc(y)}`;
function navBuild(){
 const ch='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
 const maps=MAPS.map(p=>`<a href="#/|${enc(p)}">${E(p)}</a>`).join("");
 const ags=AGS().map(g=>`<div class="mi"><a href="#/${enc(g)}">${E(g)}<span>›</span></a><div class="menu">${MAPS.map(p=>`<a href="${H(g,p)}">${E(p)}</a>`).join("")}</div></div>`).join("");
 $("#nav").innerHTML=`<a href="#/">Home</a><div class="dd"><span class="t" tabindex="0">Current Map Pool ${ch}</span><div class="menu">${maps}</div></div><div class="dd"><span class="t" tabindex="0">Agents ${ch}</span><div class="menu">${ags}</div></div>`;
 $("#nav").onclick=e=>{if(e.target.closest("a"))document.activeElement?.blur()};
}

function route(){
 const [a,m]=location.hash.slice(2).split("|").map(decodeURIComponent);let h="";const ag=AGS();
 if(!a&&!m){
  const o=[...ag].sort((x,y)=>num(y)-num(x)||x.localeCompare(y));
  h=`<section class="hero"><h1>Lineup Guide</h1><p>Your own Valorant lineups, sorted by agent and map.</p><button class="btn" onclick="edit()">+ Add lineup</button></section>
  <h2 class="sh">Agents</h2><div class="grid">${o.map(g=>tile("#/"+enc(g),g,num(g)?cnt(num(g)):"No lineups yet",!num(g),gi("agent:"+g)?.i)).join("")}</div>
  <h2 class="sh">Maps</h2><div class="grid">${MAPS.map(p=>tile("#/|"+enc(p),p,num(0,p)?cnt(num(0,p)):"No lineups yet",!num(0,p),gi("map:"+p)?.i)).join("")}</div>`;
 }else if(!a){
  const as=Object.keys(C.agents).filter(g=>num(g,m));
  h=`<p class="crumbs"><a href="#/">Home</a> / ${E(m)}</p><div class="duo">${ban("map:"+m,sw(m,MAPS,p=>"#/|"+enc(p)),"Map")}</div><h2 class="sh">Agents with lineups here</h2>`+
  (as.length?`<div class="grid">${as.map(g=>tile(H(g,m),g,cnt(num(g,m)),0,gi("agent:"+g)?.i)).join("")}</div>`:'<p class="empty">No lineups on this map yet.</p>');
 }else if(!m){
  h=`<p class="crumbs"><a href="#/">Home</a> / ${E(a)}</p><div class="duo">${ban("agent:"+a,sw(a,ag,x=>"#/"+enc(x)),"Agent")}</div><h2 class="sh">Maps</h2><div class="grid">${Object.keys(C.maps).filter(p=>C.maps[p]||num(a,p)).map(p=>tile(H(a,p),p,num(a,p)?cnt(num(a,p)):"None yet",!num(a,p),gi("map:"+p)?.i)).join("")}</div>`;
 }else{
  if(F.site&&!SITES(m).includes(F.site))F.site="";
  const set=(k,v,t)=>`<div class="fg"><span>${t}</span>${["",...v].map(o=>`<button class="chip${F[k]==o?" on":""}" data-v="${E(o)}" onclick="setF('${k}',this.dataset.v)">${o||"All"}</button>`).join("")}</div>`;
  const abs=[...new Set(L.filter(x=>x.agent==a&&x.map==m&&x.ability).map(x=>x.ability))].sort();if(F.ability&&!abs.includes(F.ability))F.ability="";
  const list=L.map((x,i)=>({...x,i})).filter(x=>x.agent==a&&x.map==m&&(!F.mode||x.mode==F.mode)&&(!F.site||x.site==F.site)&&(!F.side||x.side==F.side)&&(!F.ability||x.ability==F.ability)).sort((p,q)=>(q.fav|0)-(p.fav|0)||p.i-q.i);CUR=list.map(x=>x.i);
  h=`<p class="crumbs"><a href="#/">Home</a> / <a href="#/${enc(a)}">${E(a)}</a> / ${E(m)}</p>
  <div class="nav">${sw(a,ag,x=>H(x,m))}<span class="on">on</span>${sw(m,MAPS,p=>H(a,p))}${set("site",SITES(m),"Site")}</div>
  <div class="duo">${ban("agent:"+a,"","Agent")}${ban("map:"+m,"","Map")}</div>
  <div class="filters">${set("mode",["Offense","Defense"],"Mode")}${set("side",["CT","T"],"Side")}${abs.length?set("ability",abs,"Ability"):""}${list.length>1?'<button class="chip" onclick="rnd()">Random lineup</button>':""}</div>
  <div class="cards">${list.map(x=>card(x)).join("")}</div>${list.length?"":'<p class="empty">No lineups here yet.</p>'}`;
 }
 app.innerHTML=h;scrollTo(0,0);
}
function dupe(i){const b=JSON.parse(JSON.stringify(L[i]));b.title=(b.title||"Lineup")+" (copy)";b.fav=0;edit(null,b)}
/* drag a card onto another card to reorder (starred lineups stay first, so drag within the starred group or within the rest) */
let DG=-1;
const same=(a,b)=>(L[a].fav|0)==(L[b].fav|0);
function dgs(e,i){DG=i;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(i));e.currentTarget.classList.add("dg")}
function dgo(e,i){if(DG<0||DG==i||!same(DG,i))return;e.preventDefault();e.currentTarget.classList.add("ov")}
function dgl(e){e.currentTarget.classList.remove("ov")}
function dge(){DG=-1;document.querySelectorAll(".card.dg,.card.ov").forEach(c=>c.classList.remove("dg","ov"))}
async function dgd(e,i){e.preventDefault();const f=DG;dge();if(f<0||f==i||!same(f,i))return;
 const o=CUR.filter(x=>x!=f);o.splice(o.indexOf(i)+(CUR.indexOf(f)<CUR.indexOf(i)?1:0),0,f);
 const pos=[...CUR].sort((a,b)=>a-b),it=o.map(k=>L[k]);pos.forEach((q,k)=>L[q]=it[k]);
 const y=scrollY;await save();route();scrollTo(0,y)}
function rnd(){if(CUR.length)view(CUR[Math.floor(Math.random()*CUR.length)])}
function setF(k,v){F[k]=v;const y=scrollY;route();scrollTo(0,y)}

function view(i){
 const x=L[i];VI=i;const k=CUR.indexOf(i),nv=k>=0&&CUR.length>1?`<button class="btn g" onclick="view(${CUR[(k+CUR.length-1)%CUR.length]})">Previous</button><button class="btn g" onclick="view(${CUR[(k+1)%CUR.length]})">Next</button>`:"";
 $("#m").innerHTML=`<div class="box"><button class="x" onclick="closeM()" aria-label="Close">×</button><h2>${E(x.title)}</h2><div>${E(x.agent)} · ${E(x.map)} &nbsp;${tags(x)} ${fvb({fav:x.fav,i})}</div>${x.by?`<div class="mu wh">Shared by ${E(x.by)}</div>`:""}${x.notes?`<p class="nt">${E(x.notes)}</p>`:""}
 <div class="steps">${STEPS.map(([k,t])=>x[k]&&(x[k].t||x[k].i)?`<div class="step"><h4>${t}</h4>${x[k].t?`<p>${E(x[k].t)}</p>`:""}${x[k].i?pic(x[k].i):""}</div>`:"").join("")}</div>
 <div class="act"><button class="btn" onclick="edit(${i})">Edit</button><button class="btn g" onclick="dupe(${i})">Duplicate</button><button class="btn g" onclick="shareOne(${i})">Share</button><button class="btn g" onclick="del(${i})">Delete</button>${nv}</div></div>`;
 $("#m").className="show";
}
async function del(i){if(!confirm("Delete this lineup?"))return;L.splice(i,1);await save();closeM();route()}

const sel=(id,arr,v)=>`<select id="${id}">${arr.map(o=>`<option${o==v?" selected":""}>${E(o)}</option>`).join("")}</select>`;
const dz=k=>ed[k].i?`<img src="${ed[k].i}" alt="">`:"Click, drop, or paste an image";
function edit(i,base){
 const [ca,cm]=location.hash.slice(2).split("|").map(decodeURIComponent);
 ed=i==null?base||{agent:ca||AG[0],map:cm||MAPS[0],mode:"Offense",site:"A",side:"CT",ability:"",fav:0,title:"",area:{},aim:{},result:{}}:JSON.parse(JSON.stringify(L[i]));
 ed.i=i;STEPS.forEach(([k])=>ed[k]=ed[k]||{});
 const ag=[...new Set([...AG,ed.agent])];
 $("#m").innerHTML=`<div class="box"><button class="x" onclick="closeM()" aria-label="Close">×</button><h2>${i==null?"Add lineup":"Edit lineup"}</h2>
 <div class="row"><div><label>Agent</label>${sel("e-agent",ag,ed.agent)}</div><div><label>Map</label>${sel("e-map",[...new Set([...MAPS,ed.map])],ed.map)}</div></div>
 <div class="row"><div><label>Mode</label>${sel("e-mode",["Offense","Defense"],ed.mode)}</div><div><label>Site</label>${sel("e-site",SITES(ed.map,ed.site),ed.site)}</div><div><label>Side</label>${sel("e-side",["CT","T"],ed.side)}</div></div>
 <div class="row"><div><label>Ability</label>${abSel(ed.ability)}</div><div><label>Favourite</label><label class="ck"><input type="checkbox" id="e-fav"${ed.fav?" checked":""}>Star this lineup</label></div></div>
 <label>Title</label><input type="text" id="e-title" value="${E(ed.title)}" placeholder="e.g. Incendiary on A default">
 <label>Notes</label><textarea id="e-notes" placeholder="Anything to remember, e.g. jump-throw, crouch, wait for the ding">${E(ed.notes)}</textarea>
 ${STEPS.map(([k,t,ph])=>`<div class="st"><h4>${t}</h4><textarea id="t-${k}" data-k="${k}" placeholder="${ph}">${E(ed[k].t)}</textarea><div class="drop" tabindex="0" data-k="${k}" onclick="pk='${k}';$('#f').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();put('${k}',event.dataTransfer.files[0])">${dz(k)}</div><button class="rm" onclick="annot('${k}')">Annotate</button><button class="rm" onclick="ed['${k}'].i='';ed['${k}'].o='';ed['${k}'].a=null;paint('${k}')">Remove image</button></div>`).join("")}
 <div class="act"><button class="btn" onclick="saveL()">Save lineup</button><button class="btn g" onclick="closeM()">Cancel</button></div></div>`;
 $("#e-map").onchange=siteOpts;
 $("#m").className="show";
}
function siteOpts(){const o=SITES($("#e-map").value),c=$("#e-site").value;$("#e-site").innerHTML=o.map(x=>`<option>${x}</option>`).join("");$("#e-site").value=o.includes(c)?c:"A"}
const paint=k=>$(`.drop[data-k=${k}]`).innerHTML=dz(k);
const shrink=f=>new Promise(ok=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.85))};im.src=u});
async function put(k,f){if(!f||!f.type.startsWith("image/"))return;ed[k].i=await shrink(f);ed[k].o="";ed[k].a=null;paint(k)}
$("#f").onchange=e=>{put(pk,e.target.files[0]);e.target.value=""};
onpaste=e=>{const k=document.activeElement?.dataset?.k,f=e.clipboardData?.files[0];if(ed&&k&&f){e.preventDefault();put(k,f)}};
async function saveL(){
 ed.agent=$("#e-agent").value;ed.map=$("#e-map").value;ed.mode=$("#e-mode").value;ed.site=$("#e-site").value;ed.side=$("#e-side").value;ed.ability=$("#e-ability").value.trim();ed.fav=$("#e-fav").checked?1:0;ed.notes=$("#e-notes").value.trim();
 ed.title=$("#e-title").value.trim()||"Untitled lineup";STEPS.forEach(([k])=>ed[k].t=$("#t-"+k).value.trim());
 const {i,...x}=ed;i==null?L.push(x):L[i]=x;await save();ed=null;closeM();F=F0();
 const h=`#/${enc(x.agent)}|${enc(x.map)}`;location.hash==h?route():location.hash=h;
}
function closeM(){$("#m").className="";ed=null;VI=-1}
const zoom=s=>{$("#z img").src=s;$("#z").className="show"};
$("#m").onclick=e=>{if(e.target.id=="m")closeM()};
onkeydown=e=>{if($("#an").className=="show"){if(e.key=="Escape")anClose();else if((e.ctrlKey||e.metaKey)&&e.key=="z"){e.preventDefault();AN.sh.pop();anDraw()}return}if(e.key=="Escape"){closeM();$("#z").className=""}else if(!ed&&VI>=0&&/^Arrow(Left|Right)$/.test(e.key)&&$("#z").className!="show"){const k=CUR.indexOf(VI);if(k>=0&&CUR.length>1)view(CUR[(k+(e.key=="ArrowRight"?1:CUR.length-1))%CUR.length])}};

async function cycFav(i){const y=scrollY;L[i].fav=(L[i].fav|0)?0:1;await save();route();scrollTo(0,y);if($("#m").className=="show"&&!ed)view(i)}

/* auto-save to a real file on your computer (Chrome or Edge) */
let FH=null,fsOk=false,fsT=0,fsMsg="";
const canFS=!!(window.showSaveFilePicker&&window.showOpenFilePicker),fsTypes=[{description:"Lineup Guide data",accept:{"application/json":[".json"]}}];
function fsUI(){const b=$("#fs");if(!b)return;if(!FH){b.hidden=true;return}b.hidden=false;b.textContent=fsOk?"Auto-save on":"Reconnect auto-save";b.className="chip "+(fsOk?"ok":"warn");b.title=FH.name+(fsMsg?" · "+fsMsg:"")}
function fsClick(){fsOk?settings():fsConnect()}
async function fsWrite(){if(!FH||!fsOk)return;try{const w=await FH.createWritable();await w.write(new Blob([JSON.stringify({lineups:L,info:I})],{type:"application/json"}));await w.close();fsMsg="Last saved "+new Date().toLocaleTimeString()}catch(e){fsOk=false;fsMsg="Stopped: "+e.message}fsUI()}
function autosave(){if(!FH||!fsOk)return;clearTimeout(fsT);fsT=setTimeout(fsWrite,500)}
async function fsPerm(ask){try{const o={mode:"readwrite"};let p=await FH.queryPermission(o);if(p!="granted"&&ask)p=await FH.requestPermission(o);fsOk=p=="granted"}catch{fsOk=false}fsUI();return fsOk}
async function fsConnect(){if(FH&&await fsPerm(true)){await fsWrite();if($("#m").className=="show"&&!ed)settings()}}
async function fsNew(){try{const h=await showSaveFilePicker({suggestedName:"lineup-guide-data.json",types:fsTypes});FH=h;await put1("H",h);fsOk=true;await fsWrite();settings()}catch(e){if(e.name!="AbortError")alert("Couldn't set up the save file: "+e.message)}}
async function fsRead(h){const t=await(await h.getFile()).text();if(!t.trim())return null;const d=JSON.parse(t),ls=Array.isArray(d)?d:d.lineups;if(!Array.isArray(ls))throw 0;return{ls,info:Array.isArray(d)?{}:d.info||{}}}
async function fsApply(r){L=r.ls;I=r.info;await put1("L",L);await put1("I",I);route();navBuild()}
async function fsUse(){try{const[h]=await showOpenFilePicker({types:fsTypes});if(await h.requestPermission({mode:"readwrite"})!="granted")return;let r;try{r=await fsRead(h)}catch{return alert("That file isn't a Lineup Guide backup.")}
 if(r&&r.ls.length){if(!confirm("This file has "+r.ls.length+" lineups. This browser has "+L.length+".\n\nOK: load the file's lineups and replace what's in this browser.\nCancel: do nothing (use Backup first if you want a copy of what's here)."))return;await fsApply(r)}
 FH=h;await put1("H",h);fsOk=true;await fsWrite();settings()}catch(e){if(e.name!="AbortError")alert("Couldn't use that file: "+e.message)}}
async function fsLoad(){try{if(!await fsPerm(true))return;const r=await fsRead(FH);if(!r)return alert("The file is empty.");if(!confirm("Load "+r.ls.length+" lineups from "+FH.name+" and replace what's in this browser?"))return;await fsApply(r);settings()}catch{alert("Couldn't read that file.")}}
async function fsStop(){if(!confirm("Stop auto-saving to a file? Your lineups stay in the browser and the file stays where it is."))return;FH=null;fsOk=false;await put1("H",null);fsUI();settings()}
function fsPanel(){
 if(!canFS)return'<p class="mu">Auto-save to a file needs Chrome or Edge. Backup and Restore above still work in any browser.</p>';
 if(!FH)return'<p class="mu">Pick a file once and every change is saved to it automatically. It uses the same format as Backup, so you can Restore from it any time.</p><div class="act" style="margin-top:12px"><button class="btn g" onclick="fsNew()">Create save file</button><button class="btn g" onclick="fsUse()">Use existing file</button></div>';
 return`<p class="mu">Saving to <b>${E(FH.name)}</b>. ${fsOk?E(fsMsg||"Auto-save is on."):"Paused: the browser needs one click to allow writing again each time you reopen the page."}</p><div class="act" style="margin-top:12px">${fsOk?"":'<button class="btn" onclick="fsConnect()">Reconnect</button>'}<button class="btn g" onclick="fsLoad()">Load from file</button><button class="btn g" onclick="fsStop()">Stop auto-save</button></div>`}

/* image annotations: the original image is kept (o), the marked-up copy is what shows everywhere (i), and the marks (a) stay editable */
let AN=null;
const TOOLS=[["Arrow","arrow"],["Circle","circle"],["Line","line"],["Pen","pen"],["Text","text"]],COLS=["#ff4655","#ffd23f","#4fd1c5","#ffffff","#111111"],SIZES=[["Thin",4],["Medium",7],["Thick",12]];
function annot(k){const src=ed[k].o||ed[k].i;if(!src)return alert("Add an image to this step first.");const im=new Image();im.onload=()=>anOpen(k,im,src);im.src=src}
function anOpen(k,im,src){
 AN={k,im,src,sh:JSON.parse(JSON.stringify(ed[k].a||[])),tool:"arrow",c:COLS[0],w:7,cur:null,sc:Math.max(im.naturalWidth,im.naturalHeight)/1000};
 $("#an").innerHTML='<div class="tb" id="antb"></div><div class="cw"><canvas id="cv"></canvas></div>';
 const cv=$("#cv");cv.width=im.naturalWidth;cv.height=im.naturalHeight;
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{if(e.button)return;const p=pt(e),w=AN.w*AN.sc;
  if(AN.tool=="text"){const t=prompt("Text to add");if(t&&t.trim()){AN.sh.push({t:"text",c:AN.c,w,x:p[0],y:p[1],s:t.trim()});anDraw()}return}
  cv.setPointerCapture(e.pointerId);
  AN.cur=AN.tool=="pen"?{t:"pen",c:AN.c,w,p:[p]}:AN.tool=="circle"?{t:"circle",c:AN.c,w,x:p[0],y:p[1],r:0}:{t:AN.tool,c:AN.c,w,x1:p[0],y1:p[1],x2:p[0],y2:p[1]};anDraw()};
 cv.onpointermove=e=>{const s=AN.cur;if(!s)return;const p=pt(e);
  if(s.t=="pen")s.p.push(p);else if(s.t=="circle")s.r=Math.hypot(p[0]-s.x,p[1]-s.y);else{s.x2=p[0];s.y2=p[1]}anDraw()};
 cv.onpointerup=cv.onpointercancel=()=>{const s=AN.cur;AN.cur=null;if(s){const tiny=s.t=="circle"?s.r<4:s.t=="pen"?0:Math.hypot(s.x2-s.x1,s.y2-s.y1)<4;if(!tiny)AN.sh.push(s)}anDraw()};
 anTb();anDraw();$("#an").className="show"}
function anTb(){
 const ch=(list,key)=>list.map(([n,v])=>`<button class="chip${AN[key]==v?" on":""}" data-v="${v}" onclick="anSet('${key}',this.dataset.v)">${n}</button>`).join("");
 $("#antb").innerHTML=`<div class="g">${ch(TOOLS,"tool")}</div><div class="g">${COLS.map(c=>`<button class="sq${AN.c==c?" on":""}" style="background:${c}" data-v="${c}" onclick="anSet('c',this.dataset.v)" aria-label="Colour"></button>`).join("")}</div><div class="g">${ch(SIZES,"w")}</div><div class="g"><button class="chip" onclick="AN.sh.pop();anDraw()">Undo</button><button class="chip" onclick="if(!AN.sh.length||confirm('Remove all marks from this image?')){AN.sh=[];anDraw()}">Clear</button></div><div class="g" style="margin-left:auto"><button class="btn g" onclick="anClose()">Cancel</button><button class="btn" onclick="anDone()">Done</button></div>`}
function anSet(k,v){AN[k]=k=="w"?+v:v;anTb()}
function anDraw(){const cv=$("#cv"),g=cv.getContext("2d");g.clearRect(0,0,cv.width,cv.height);g.drawImage(AN.im,0,0);[...AN.sh,AN.cur].forEach(s=>s&&shape(g,s))}
function shape(g,s){g.save();g.strokeStyle=g.fillStyle=s.c;g.lineWidth=s.w;g.lineCap=g.lineJoin="round";g.shadowColor="#000a";g.shadowBlur=s.w*1.5;
 if(s.t=="pen"){g.beginPath();s.p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));if(s.p.length==1)g.lineTo(s.p[0][0]+.1,s.p[0][1]);g.stroke()}
 else if(s.t=="circle"){g.beginPath();g.arc(s.x,s.y,Math.max(s.r,1),0,7);g.stroke()}
 else if(s.t=="text"){g.font=`bold ${s.w*4+12}px "Segoe UI",sans-serif`;g.textBaseline="top";g.lineWidth=s.w*.7;g.strokeStyle="#000";g.strokeText(s.s,s.x,s.y);g.shadowBlur=0;g.fillText(s.s,s.x,s.y)}
 else{g.beginPath();g.moveTo(s.x1,s.y1);g.lineTo(s.x2,s.y2);g.stroke();
  if(s.t=="arrow"){const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),hl=s.w*3+14;g.beginPath();g.moveTo(s.x2,s.y2);g.lineTo(s.x2-hl*Math.cos(a-.5),s.y2-hl*Math.sin(a-.5));g.lineTo(s.x2-hl*Math.cos(a+.5),s.y2-hl*Math.sin(a+.5));g.closePath();g.fill()}}
 g.restore()}
function anDone(){const{k,im,sh}=AN;
 if(!sh.length){ed[k].i=ed[k].o||ed[k].i;ed[k].o="";ed[k].a=null}
 else{ed[k].o=ed[k].o||AN.src;const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext("2d");g.drawImage(im,0,0);sh.forEach(s=>shape(g,s));ed[k].i=c.toDataURL("image/jpeg",.88);ed[k].a=sh}
 paint(k);anClose()}
function anClose(){$("#an").className="";$("#an").innerHTML="";AN=null}

function settings(){
 const box=(o,k)=>Object.keys(o).map(n=>`<label class="ck"><input type="checkbox" data-s="${k}" value="${E(n)}"${o[n]?" checked":""}>${E(n)}</label>`).join("");

 <h3 class="sg">Maps (current map pool)</h3><div class="cks">${box(C.maps,"maps")}</div>

}

/* ---- sharing + import: one file format for friends' lineups and your own backups ---- */
const lk=x=>[x.agent,x.map,x.mode,x.site,x.side,x.title,(x.aim?.i||x.result?.i||x.area?.i||"").length].join("|");
function shareUI(){
 const [ca,cm]=location.hash.slice(2).split("|").map(decodeURIComponent);
 const op=(arr,v)=>`<option value="">All</option>`+arr.map(o=>`<option${o==v?" selected":""}>${E(o)}</option>`).join("");
 const ags=[...new Set(L.map(x=>x.agent))].sort(),mps=[...new Set(L.map(x=>x.map))].sort();
 let by="";try{by=localStorage.getItem("lg-by")||""}catch{}
 return `<p class="mu">Send lineups to a friend as one small file. They add it with Import. Your favorites aren’t included.</p>
 <div class="row"><div><label>Agent</label><select id="sh-a">${op(ags,ca)}</select></div><div><label>Map</label><select id="sh-m">${op(mps,cm)}</select></div></div>
 <label>Credit (optional)</label><input type="text" id="sh-by" value="${E(by)}" placeholder="Your name, shown on shared lineups">
 <label class="ck"><input type="checkbox" id="sh-i">Include agent and map descriptions and images</label>
 <div class="act" style="margin-top:12px"><button class="btn" onclick="shareExp()">Export lineups</button><button class="btn g" onclick="$('#imp').click()">Import lineups</button></div>`}
function shareExp(){
 const a=$("#sh-a").value,m=$("#sh-m").value,ls=L.filter(x=>(!a||x.agent==a)&&(!m||x.map==m));
 if(!ls.length)return alert("No lineups match that agent and map.");
 shareOut(ls,[a,m].filter(Boolean).join("-")||"all",$("#sh-i").checked)}
const shareOne=i=>shareOut([L[i]],L[i].title,false);
function shareOut(ls,name,inc){
 let by="";const f=$("#sh-by");
 try{if(f){by=f.value.trim();localStorage.setItem("lg-by",by)}else by=localStorage.getItem("lg-by")||""}catch{}
 const info={};if(inc)ls.forEach(x=>["agent:"+x.agent,"map:"+x.map].forEach(k=>{if(gi(k))info[k]=gi(k)}));
 const out={app:"lineup-guide",kind:"share",v:1,lineups:ls.map(({fav,...x})=>{const b=x.by||by;return b?{...x,by:b}:x}),...(inc?{info}:{})};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:"application/json"}));
 a.download="lineup-guide-share-"+String(name).replace(/[^\w-]+/g,"_")+".json";a.click()}
async function imp(f){
 $("#imp").value="";if(!f)return;
 try{
  const d=JSON.parse(await f.text()),ls=Array.isArray(d)?d:d.lineups;
  if(!Array.isArray(ls)||ls.some(x=>!x||!x.agent||!x.map))throw 0;
  const sh=d.kind=="share",have=new Set(L.map(lk)),add=[];
  ls.forEach(x=>{const k=lk(x);if(!have.has(k)){have.add(k);add.push(x)}});
  const skip=ls.length-add.length,inf=Object.entries(d.info||{});
  if(!add.length&&!inf.length)return alert("Nothing new: all "+ls.length+" lineups are already here.");
  if(!confirm(`Add ${add.length} new lineup${add.length==1?"":"s"}${skip?` (${skip} already here, skipped)`:""}?`))return;
  add.forEach(x=>L.push(sh?{...x,fav:0}:x));
  inf.forEach(([k,v])=>{if(!sh||!(gi(k)&&(gi(k).d||gi(k).i)))I[k]=v});
  await save();await save("I");
  const offA=[...new Set(add.map(x=>x.agent).filter(a=>!C.agents[a]))],offM=[...new Set(add.map(x=>x.map).filter(m=>!C.maps[m]))];
  if((offA.length||offM.length)&&confirm(`These are hidden in your settings: ${[...offA,...offM].join(", ")}. Turn them on so the new lineups show up?`)){
   S.agents=S.agents||{};S.maps=S.maps||{};offA.forEach(a=>S.agents[a]=true);offM.forEach(m=>S.maps[m]=true);applyCfg();await save("S");navBuild()}
  closeM();route();alert(`Added ${add.length} lineup${add.length==1?"":"s"}.`)
 }catch{alert("That file isn't a Lineup Guide file.")}}
